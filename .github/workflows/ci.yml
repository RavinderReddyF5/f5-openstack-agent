name: CI Workflow

on:
  push:
    branches:
      - '**'  # Run on pushes to all branches
  pull_request:
    branches:
      - '**'  # Run on pull requests to all branches


jobs:
  build:
    runs-on: ubuntu-latest
    # container: coatldev/six:latest
    # container: centos:7
    # container: centos/python-27-centos7
    env:  # Define static global environment variables
      DIST_REPO: "f5-openstack-agent-dist"

    steps:
      - name: Checkout code
        uses: actions/checkout@v2


    # Install Python and Dependencies
      - name: Setup Python
        run: |
          # Get package version
          lsb_release -a
          sudo apt update
          wget http://security.ubuntu.com/ubuntu/pool/universe/p/python2.7/python2.7_2.7.18-13ubuntu1.5_amd64.deb http://security.ubuntu.com/ubuntu/pool/universe/p/python2.7/libpython2.7-stdlib_2.7.18-13ubuntu1.5_amd64.deb http://security.ubuntu.com/ubuntu/pool/universe/p/python2.7/python2.7-minimal_2.7.18-13ubuntu1.5_amd64.deb http://security.ubuntu.com/ubuntu/pool/universe/p/python2.7/libpython2.7-minimal_2.7.18-13ubuntu1.5_amd64.deb  
          sudo apt install ./libpython2.7-minimal_2.7.18-13ubuntu1.5_amd64.deb ./libpython2.7-stdlib_2.7.18-13ubuntu1.5_amd64.deb ./python2.7-minimal_2.7.18-13ubuntu1.5_amd64.deb ./python2.7_2.7.18-13ubuntu1.5_amd64.deb

      - name: Set Dynamic Environment Variables
        # container: centos/python-27-centos7
        id: set_env_vars
        run: |
          # Get package version
          lsb_release -a
          python2.7 --version
          PKG_VERSION=$(python2.7 -c "import f5_openstack_agent; print(f5_openstack_agent.__version__)")

          # Get package release version
          PKG_RELEASE=$(python2.7 ${DIST_REPO}/scripts/get-version-release.py --release)

          # Set other variables based on the above
          echo "PKG_VERSION=${PKG_VERSION}" >> $GITHUB_ENV
          echo "PKG_RELEASE=${PKG_RELEASE}" >> $GITHUB_ENV
          echo "PKG_RELEASE_EL7=${DIST_REPO}/rpms/build/f5-openstack-agent-${PKG_VERSION}-${PKG_RELEASE}.el7.noarch.rpm" >> $GITHUB_ENV
          echo "PKG_RELEASE_1404=${DIST_REPO}/deb_dist/python-f5-openstack-agent_${PKG_VERSION}-${PKG_RELEASE}_1404_all.deb" >> $GITHUB_ENV
          echo "RELEASE_TAG=v$(echo $PKG_VERSION | cut -d . -f 1,2)" >> $GITHUB_ENV

      - name: Use Environment Variables
        run: |
          echo "Package Version: $PKG_VERSION"
          echo "Package Release: $PKG_RELEASE"
          echo "EL7 Package Path: $PKG_RELEASE_EL7"
          echo "1404 Package Path: $PKG_RELEASE_1404"
          echo "Release Tag: $RELEASE_TAG"

      - name: Install pip and dependencies
        run: |
          echo "Package Version: $PKG_VERSION"
          echo "Package Release: $PKG_RELEASE"
          echo "EL7 Package Path: $PKG_RELEASE_EL7"
          echo "1404 Package Path: $PKG_RELEASE_1404"
          echo "Release Tag: $RELEASE_TAG"
          # source ~/virtualenv/python2.7/bin/activate
          curl https://bootstrap.pypa.io/pip/2.7/get-pip.py --output get-pip.py # Fetch get-pip.py for python 2.7 
          python2.7 get-pip.py
          pip --version
          # python2.7 -m pip2 install pip2==19.0.3
          pip install -Iv tox==3.25.1
          pip install -r requirements.style.txt
          pep257 ./test/functional/neutronless/esd/test_esd.py
          flake8 --ignore=H304 ./test/functional/neutronless/esd/test_esd.py
          pep257 ./test/functional/neutronless/esd/conftest.py
          flake8 --ignore=H304 ./test/functional/neutronless/esd/conftest.py
          pep257 ./test/functional/neutronless/esd/test_esd_pairs.py
          flake8 --ignore=H304 ./test/functional/neutronless/esd/test_esd_pairs.py
          flake8 ./f5_openstack_agent
          tox -e unit
          python2.7 f5-openstack-agent-dist/scripts/universal_truth.py
          echo "setup.cfg:"
          cat setup.cfg
          echo "stdeb.cfg:"
          cat f5-openstack-agent-dist/deb_dist/stdeb.cfg
          f5-openstack-agent-dist/scripts/package_agent.sh "redhat" "7"
          f5-openstack-agent-dist/scripts/package_agent.sh "ubuntu" "14.04"
          sudo chown -R travis:travis ${DIST_REPO}/rpms/build
          sudo chown -R travis:travis ${DIST_REPO}/deb_dist/*.deb
          f5-openstack-agent-dist/scripts/test_install.sh "redhat" "7" ${PKG_RELEASE_EL7}
          f5-openstack-agent-dist/scripts/test_install.sh "ubuntu" "14.04" ${PKG_RELEASE_1404}
          

      # - name: Set up Python
      #   uses: actions/setup-python@v2
      #   with:
      #     python-version: '2.7'  # Specify Python version

      - name: Download Docker images
        run: |
          wget https://github.com/F5Networks/docker-images/raw/master/centos:6.tar.gz
          wget https://github.com/F5Networks/docker-images/raw/master/centos:7.tar.gz
          wget https://github.com/F5Networks/docker-images/raw/master/f5devcentral_containthedocs:latest.tar.gz
          wget https://github.com/F5Networks/docker-images/raw/master/ubuntu:trusty.tar.gz

      - name: Load Docker images
        run: |
          docker load -i centos:6.tar.gz
          docker load -i centos:7.tar.gz
          docker load -i f5devcentral_containthedocs:latest.tar.gz
          docker load -i ubuntu:trusty.tar.gz

