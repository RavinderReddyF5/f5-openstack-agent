name: F5 OpenStack Agent CI

on:
  push:
    branches:
      - '*'
    tags:
      - 'v*'
  pull_request:
    branches:
      - '*'

env:
  DIST_REPO: f5-openstack-agent-dist

jobs:
  # Job 1: Linting and Unit Tests (runs in Python 2.7 container)
  lint-and-unit-test:
    runs-on: ubuntu-22.04
    container:
      image: python:2.7-buster
    
    defaults:
      run:
        shell: bash
    
    steps:
      - name: Fix Debian Buster repositories (EOL)
        run: |
          cat > /etc/apt/sources.list << 'EOF'
          deb http://archive.debian.org/debian buster main
          deb http://archive.debian.org/debian-security buster/updates main
          EOF
          echo 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/99no-check-valid-until

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y git

      - name: Configure Git
        run: |
          git config --global user.email "OpenStack_TravisCI@f5.com"
          git config --global user.name "Travis F5 Openstack"
          git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: Install Python dependencies with pinned versions
        run: |
          # Pin pip and setuptools to Python 2.7 compatible versions
          pip install pip==9.0.3
          pip install setuptools==44.1.1
          pip install wheel==0.37.1
          
          # Pin problematic packages to Python 2.7 compatible versions
          pip install lazy-object-proxy==1.4.3
          pip install wrapt==1.11.2
          pip install astroid==1.6.6
          pip install pylint==1.9.5
          pip install isort==4.3.21
          pip install typing==3.7.4.3
          pip install configparser==4.0.2
          pip install futures==3.3.0
          pip install funcsigs==1.0.2
          pip install enum34==1.1.10
          pip install singledispatch==3.7.0
          pip install backports.functools-lru-cache==1.6.6
          
          # Now install tox and style requirements
          pip install tox==3.28.0
          pip install -r requirements.style.txt

      - name: Run pep257 checks
        run: |
          pep257 ./test/functional/neutronless/esd/test_esd.py
          pep257 ./test/functional/neutronless/esd/conftest.py
          pep257 ./test/functional/neutronless/esd/test_esd_pairs.py

      - name: Run flake8 checks
        run: |
          flake8 --ignore=H304 ./test/functional/neutronless/esd/test_esd.py
          flake8 --ignore=H304 ./test/functional/neutronless/esd/conftest.py
          flake8 --ignore=H304 ./test/functional/neutronless/esd/test_esd_pairs.py
          flake8 ./f5_openstack_agent

      - name: Run unit tests
        run: tox -e unit

      - name: Run universal truth script
        run: python f5-openstack-agent-dist/scripts/universal_truth.py

      - name: Display config files
        run: |
          echo "setup.cfg:"
          cat setup.cfg
          echo "stdeb.cfg:"
          cat f5-openstack-agent-dist/deb_dist/stdeb.cfg

  # Job 2: Build Packages (runs on HOST with Docker access)
  build-packages:
    runs-on: ubuntu-22.04
    needs: lint-and-unit-test
    
    outputs:
      pkg_version: ${{ steps.vars.outputs.pkg_version }}
      pkg_release: ${{ steps.vars.outputs.pkg_release }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set environment variables
        id: vars
        run: |
          # Get version using Python 2.7 container with pinned packages
          PKG_VERSION=$(docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace python:2.7-buster \
            bash -c '
              pip install pip==9.0.3 setuptools==44.1.1 > /dev/null 2>&1
              python -c "import f5_openstack_agent; print f5_openstack_agent.__version__"
            ')
          
          PKG_RELEASE=$(docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace python:2.7-buster \
            bash -c "
              pip install pip==9.0.3 setuptools==44.1.1 > /dev/null 2>&1
              python ${DIST_REPO}/scripts/get-version-release.py --release
            ")
          
          echo "pkg_version=${PKG_VERSION}" >> $GITHUB_OUTPUT
          echo "pkg_release=${PKG_RELEASE}" >> $GITHUB_OUTPUT
          
          echo "PKG_VERSION=${PKG_VERSION}" >> $GITHUB_ENV
          echo "PKG_RELEASE=${PKG_RELEASE}" >> $GITHUB_ENV
          echo "PKG_RELEASE_EL7=${DIST_REPO}/rpms/build/f5-openstack-agent-${PKG_VERSION}-${PKG_RELEASE}.el7.noarch.rpm" >> $GITHUB_ENV
          echo "PKG_RELEASE_1404=${DIST_REPO}/deb_dist/python-f5-openstack-agent_${PKG_VERSION}-${PKG_RELEASE}_1404_all.deb" >> $GITHUB_ENV
          
          # Determine CTLR_VERSION
          BRANCH_NAME=${GITHUB_REF_NAME}
          if [[ "$BRANCH_NAME" == *"-stable" ]]; then
            CTLR_VERSION="v$(echo $BRANCH_NAME | sed 's/-stable//g')"
          elif [[ "$BRANCH_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]* ]]; then
            IFS='.' read -ra va <<< "${BRANCH_NAME//v/}"
            CTLR_VERSION="v${va[0]}.${va[1]}"
          else
            CTLR_VERSION="$BRANCH_NAME"
          fi
          echo "CTLR_VERSION=${CTLR_VERSION}" >> $GITHUB_ENV

      - name: Build RedHat 7 package
        run: f5-openstack-agent-dist/scripts/package_agent.sh "redhat" "7"

      - name: Build RedHat 6 package
        run: f5-openstack-agent-dist/scripts/package_agent.sh "redhat" "6"

      - name: Build Ubuntu 14.04 package
        run: f5-openstack-agent-dist/scripts/package_agent.sh "ubuntu" "14.04"

      - name: Fix permissions
        run: |
          sudo chown -R $USER:$USER ${DIST_REPO}/rpms/build || true
          sudo chown -R $USER:$USER ${DIST_REPO}/deb_dist/*.deb || true

      - name: Test RedHat 7 package installation
        run: f5-openstack-agent-dist/scripts/test_install.sh "redhat" "7" ${{ env.PKG_RELEASE_EL7 }}

      - name: Test Ubuntu 14.04 package installation
        run: f5-openstack-agent-dist/scripts/test_install.sh "ubuntu" "14.04" ${{ env.PKG_RELEASE_1404 }}

      - name: Generate MD5 checksums
        run: |
          md5sum ${{ env.PKG_RELEASE_EL7 }} > ${{ env.PKG_RELEASE_EL7 }}.md5
          md5sum --check ${{ env.PKG_RELEASE_EL7 }}.md5
          md5sum ${{ env.PKG_RELEASE_1404 }} > ${{ env.PKG_RELEASE_1404 }}.md5
          md5sum --check ${{ env.PKG_RELEASE_1404 }}.md5

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rpm-packages
          path: |
            ${{ env.DIST_REPO }}/rpms/build/*.rpm
            ${{ env.DIST_REPO }}/rpms/build/*.md5

      - name: Upload DEB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deb-packages
          path: |
            ${{ env.DIST_REPO }}/deb_dist/*.deb
            ${{ env.DIST_REPO }}/deb_dist/*.md5

  # Job 3: Build Documentation
  build-docs:
    runs-on: ubuntu-22.04
    needs: lint-and-unit-test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pull docs container
        run: docker pull f5devcentral/containthedocs:latest

      - name: Build and test docs
        run: ./docs/scripts/docker-docs.sh ./docs/scripts/test-docs.sh

  # Job 4: Create GitHub Release
  release:
    needs: [build-packages, build-docs]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Download RPM artifacts
        uses: actions/download-artifact@v4
        with:
          name: rpm-packages
          path: ./artifacts/rpms

      - name: Download DEB artifacts
        uses: actions/download-artifact@v4
        with:
          name: deb-packages
          path: ./artifacts/debs

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./artifacts/rpms/*
            ./artifacts/debs/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 5: Publish to PyPI
  publish-pypi:
    needs: [build-packages, build-docs]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and publish with Python 2.7
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e TWINE_USERNAME=${{ secrets.PYPI_USER }} \
            -e TWINE_PASSWORD=${{ secrets.PYPI_PASSWORD }} \
            python:2.7-buster \
            bash -c '
              # Fix repos
              echo "deb http://archive.debian.org/debian buster main" > /etc/apt/sources.list
              echo "deb http://archive.debian.org/debian-security buster/updates main" >> /etc/apt/sources.list
              echo "Acquire::Check-Valid-Until \"false\";" > /etc/apt/apt.conf.d/99no-check-valid-until
              
              # Install with pinned versions
              pip install pip==9.0.3 setuptools==44.1.1 wheel==0.37.1 twine==1.15.0
              python setup.py sdist bdist_wheel
              twine upload --repository-url https://upload.pypi.org/legacy/ dist/*
            '

  # Job 6: Deploy Documentation
  deploy-docs:
    needs: [build-packages, build-docs]
    runs-on: ubuntu-22.04
    if: |
      contains(github.ref_name, '-stable') || 
      (startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, 'v'))
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set CTLR_VERSION
        run: |
          BRANCH_NAME=${GITHUB_REF_NAME}
          if [[ "$BRANCH_NAME" == *"-stable" ]]; then
            CTLR_VERSION="v$(echo $BRANCH_NAME | sed 's/-stable//g')"
          elif [[ "$BRANCH_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]* ]]; then
            IFS='.' read -ra va <<< "${BRANCH_NAME//v/}"
            CTLR_VERSION="v${va[0]}.${va[1]}"
          else
            CTLR_VERSION="$BRANCH_NAME"
          fi
          echo "CTLR_VERSION=${CTLR_VERSION}" >> $GITHUB_ENV

      - name: Deploy docs
        run: ./build-tools/deploy-docs.sh publish-product-docs-to-prod openstack/agent ${{ env.CTLR_VERSION }}

  # Job 7: Slack Notifications
  notify:
    needs: [lint-and-unit-test, build-packages, build-docs]
    runs-on: ubuntu-22.04
    if: always()
    
    steps:
      - name: Slack Notification on Success
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        uses: slackapi/slack-github-action@v1.25.0
        with:
          channel-id: 'f5-openstack-agent,build_status'
          slack-message: "✅ Build succeeded for ${{ github.repository }}@${{ github.ref_name }}"
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_TOKEN }}

      - name: Slack Notification on Failure
        if: ${{ contains(needs.*.result, 'failure') }}
        uses: slackapi/slack-github-action@v1.25.0
        with:
          channel-id: 'f5-openstack-agent,build_status'
          slack-message: "❌ Build failed for ${{ github.repository }}@${{ github.ref_name }}"
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_TOKEN }}
