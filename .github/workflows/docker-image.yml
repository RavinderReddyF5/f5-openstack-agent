name: F5 OpenStack Agent CI/CD Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  tags:
    - 'v*'

env:
  DIST_REPO: "f5-openstack-agent-dist"

jobs:
  build-test:
    name: Build, Test, and Package
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the Code Repository
      - name: Checkout Code
        uses: actions/checkout@v3
      
      # 2. Set Git Configurations
      - name: Configure Git
        run: |
          git config --global user.email "OpenStack_TravisCI@f5.com"
          git config --global user.name "Travis F5 Openstack"

      # 3. Download Required Docker Images
      - name: Download Docker Images
        run: |
          wget https://github.com/F5Networks/docker-images/raw/master/centos:6.tar.gz
          wget https://github.com/F5Networks/docker-images/raw/master/centos:7.tar.gz
          wget https://github.com/F5Networks/docker-images/raw/master/f5devcentral_containthedocs:latest.tar.gz
          wget https://github.com/F5Networks/docker-images/raw/master/ubuntu:trusty.tar.gz

      # 4. Load Docker Images into the Environment
      - name: Load Docker Images
        run: |
          docker load -i centos:6.tar.gz
          docker load -i centos:7.tar.gz
          docker load -i f5devcentral_containthedocs:latest.tar.gz
          docker load -i ubuntu:trusty.tar.gz

      # 5. Set Up Python Environment
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '2.7'

      # 6. Install Required Python Dependencies
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip==19.0.3
          pip install -Iv tox==3.25.1
          pip install -r requirements.style.txt

      # 7. Execute Code Style and Syntax Checks
      - name: Run PEP257 and Flake8 Style Checks
        run: |
          pep257 ./test/functional/neutronless/esd/test_esd.py
          flake8 --ignore=H304 ./test/functional/neutronless/esd/test_esd.py
          pep257 ./test/functional/neutronless/esd/conftest.py
          flake8 --ignore=H304 ./test/functional/neutronless/esd/conftest.py
          pep257 ./test/functional/neutronless/esd/test_esd_pairs.py
          flake8 --ignore=H304 ./test/functional/neutronless/esd/test_esd_pairs.py
          flake8 ./f5_openstack_agent

      # 8. Run Unit Tests
      - name: Run Unit Tests
        run: tox -e unit

      # 9. Run Universal Truth Validation Script
      - name: Validate Universal Truth
        run: python f5-openstack-agent-dist/scripts/universal_truth.py

      # 10. Print Configuration Files for Debugging
      - name: Display setup.cfg and stdeb.cfg
        run: |
          echo "setup.cfg:"
          cat setup.cfg
          echo "stdeb.cfg:"
          cat f5-openstack-agent-dist/deb_dist/stdeb.cfg

      # 11. Build RPM and DEB Packages
      - name: Build RPM Package for CentOS
        run: f5-openstack-agent-dist/scripts/package_agent.sh "redhat" "7"

      - name: Build DEB Package for Ubuntu
        run: f5-openstack-agent-dist/scripts/package_agent.sh "ubuntu" "14.04"

      # 12. Adjust File Permissions on Build Directories
      - name: Fix File Permissions for RPM and DEB Builds
        run: |
          sudo chown -R $USER:$USER ${{ env.DIST_REPO }}/rpms/build
          sudo chown -R $USER:$USER ${{ env.DIST_REPO }}/deb_dist/*.deb

      # 13. Test Package Installation
      - name: Test RPM Installation for CentOS
        run: f5-openstack-agent-dist/scripts/test_install.sh "redhat" "7" "${env.DIST_REPO}/rpms/build/f5-openstack-agent-${PKG_VERSION}-${PKG_RELEASE}.el7.noarch.rpm"

      - name: Test DEB Installation for Ubuntu
        run: f5-openstack-agent-dist/scripts/test_install.sh "ubuntu" "14.04" "${env.DIST_REPO}/deb_dist/python-f5-openstack-agent_${PKG_VERSION}-${PKG_RELEASE}_1404_all.deb"

      # 14. Set Release Tag for Deployment
      - name: Calculate CTLR_VERSION
        id: set_version
        run: |
          if [[ "${{ github.ref }}" =~ ^v[0-9]+\.[0-9]+\.[0-9.]* ]]; then
            va=( ${{ github.ref_name//./ }} ) # Replace decimals and split into an array
            export CTLR_VERSION="${va[0]}.${va[1]}.${va[2]}"
          else
            export CTLR_VERSION="${{ github.ref }}"
          fi
          echo "CTLR_VERSION=${{ CTLR_VERSION }}" >> $GITHUB_ENV

      # 15. Print Release Branch and Version
      - name: Display Branch Name and Version
        run: |
          echo "Branch Name: ${{ github.ref }}"
          echo "Controller Version: ${{ env.CTLR_VERSION }}"
